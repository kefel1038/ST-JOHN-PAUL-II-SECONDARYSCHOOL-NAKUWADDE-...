<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | St. John Paul II School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/admin-config.js"></script>
  <style>
    body { background: var(--off-white); }
    .admin-header {
      background: var(--royal-blue);
      color: var(--white);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .admin-header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-header h1 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .admin-header h1 i { color: var(--gold-light); }
    .admin-header-actions { display: flex; gap: 10px; align-items: center; }
    .admin-user { font-size: 0.85rem; opacity: 0.9; display: flex; align-items: center; gap: 6px; }
    .btn-logout {
      background: rgba(255,255,255,0.15);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-family: var(--font-ui);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-logout:hover { background: rgba(255,255,255,0.25); }

    .admin-main { padding: 30px 0; }
    .admin-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .admin-toolbar h2 {
      font-family: var(--font-display);
      color: var(--royal-blue);
      font-size: 1.5rem;
    }
    .btn-add {
      background: linear-gradient(135deg, var(--royal-blue), var(--blue-light));
      color: var(--white);
      padding: 10px 22px;
      border-radius: var(--radius-full);
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(10,36,114,0.35); }

    .news-table-wrap {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow-x: auto;
    }
    .news-table { width: 100%; border-collapse: collapse; }
    .news-table th {
      background: var(--off-white);
      padding: 14px 16px;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--gray-600);
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 2px solid var(--gray-200);
    }
    .news-table td {
      padding: 14px 16px;
      font-size: 0.88rem;
      color: var(--gray-700);
      border-bottom: 1px solid var(--gray-100);
      vertical-align: top;
    }
    .news-table tr:hover td { background: var(--blue-pale); }
    .news-table .col-actions { width: 100px; white-space: nowrap; }
    .news-table .col-title { max-width: 250px; }
    .news-table .col-text { max-width: 300px; }
    .news-table .title-text { font-weight: 600; color: var(--royal-blue); display: block; }
    .news-table .text-preview {
      font-size: 0.82rem;
      color: var(--gray-500);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-table .cat-badge {
      display: inline-block;
      background: var(--gold);
      color: var(--white);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
    }
    .news-table .date-small { font-size: 0.8rem; color: var(--gray-500); white-space: nowrap; }
    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--gray-200);
      background: var(--white);
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }
    .btn-icon:hover { border-color: var(--blue-light); }
    .btn-edit:hover { color: var(--royal-blue); background: var(--blue-pale); }
    .btn-del:hover { color: var(--danger); background: #FEE2E2; border-color: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-500);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }
    .empty-state p { font-size: 1rem; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 36px;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-xl);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .modal-header h3 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--royal-blue);
    }
    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--gray-100);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: var(--transition);
    }
    .modal-close:hover { background: var(--gray-200); }
    .modal-footer {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--gray-200);
    }
    .btn-save {
      background: linear-gradient(135deg, var(--royal-blue), var(--blue-light));
      color: var(--white);
      padding: 10px 24px;
      border: none;
      border-radius: var(--radius-full);
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(10,36,114,0.35); }
    .btn-cancel {
      background: var(--white);
      color: var(--gray-600);
      padding: 10px 24px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-full);
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-cancel:hover { border-color: var(--gray-400); }
    .btn-danger {
      background: var(--danger);
      color: var(--white);
      padding: 10px 24px;
      border: none;
      border-radius: var(--radius-full);
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-danger:hover { background: #b91c1c; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius);
      font-size: 0.9rem;
      transition: var(--transition);
      outline: none;
      font-family: var(--font-body);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--royal-blue);
      box-shadow: 0 0 0 4px rgba(10,36,114,0.08);
    }
    .form-group textarea { min-height: 120px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .loading-spinner {
      text-align: center;
      padding: 40px;
      color: var(--gray-500);
    }
    .loading-spinner i { font-size: 2rem; margin-bottom: 12px; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--royal-blue);
      color: var(--white);
      padding: 14px 28px;
      border-radius: var(--radius-full);
      font-family: var(--font-ui);
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 9999;
      transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast i { margin-right: 8px; color: var(--gold-light); }

    .loading-btn { opacity: 0.7; cursor: not-allowed !important; }

    @media (max-width: 768px) {
      .admin-header h1 { font-size: 1rem; }
      .admin-user { display: none; }
      .form-row { grid-template-columns: 1fr; }
      .modal { padding: 24px; }
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="container">
      <h1><i class="fas fa-shield-alt"></i> Admin Dashboard</h1>
      <div class="admin-header-actions">
        <span class="admin-user"><i class="fas fa-user-circle"></i> <span id="adminEmail"></span></span>
        <button class="btn-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">
      <div class="admin-toolbar">
        <h2><i class="fas fa-newspaper" style="color:var(--gold);margin-right:8px;"></i> News & Events</h2>
        <button class="btn-add" onclick="openAddModal()"><i class="fas fa-plus"></i> Add News Article</button>
      </div>

      <div class="news-table-wrap" id="newsTableWrap">
        <div class="loading-spinner" id="loadingState">
          <i class="fas fa-spinner fa-spin"></i>
          <p>Loading news articles...</p>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Add News Article</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      </div>
      <form id="newsForm">
        <input type="hidden" id="editId" value="" />
        <div class="form-row">
          <div class="form-group">
            <label for="cat">Category</label>
            <select id="cat" required>
              <option value="">Select category...</option>
              <option value="Academic Update">Academic Update</option>
              <option value="Sports">Sports</option>
              <option value="Religious Activities">Religious Activities</option>
              <option value="Vocational">Vocational</option>
              <option value="Achievements">Achievements</option>
              <option value="Announcement">Announcement</option>
              <option value="Community Projects">Community Projects</option>
            </select>
          </div>
          <div class="form-group">
            <label for="date">Date</label>
            <input type="text" id="date" placeholder="e.g. June 5, 2026" required />
          </div>
        </div>
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="Article title" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" placeholder="Author name" value="Admin" />
          </div>
          <div class="form-group">
            <label for="img">Image Path</label>
            <input type="text" id="img" placeholder="../hero_classroom.png" value="../hero_classroom.png" />
          </div>
        </div>
        <div class="form-group">
          <label for="text">Content</label>
          <textarea id="text" placeholder="Full article text..." required></textarea>
        </div>
      </form>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveArticle()" id="saveBtn"><i class="fas fa-save"></i> Save Article</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Success!</span></div>

  <script>
    const supabase = supabaseJs.createClient(ADMIN_SUPABASE_URL, ADMIN_SUPABASE_ANON_KEY);
    let articles = [];
    let editingId = null;

    function showToast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    async function checkSession() {
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error || !session) {
        window.location.href = 'login.html';
        return null;
      }
      document.getElementById('adminEmail').textContent = session.user.email;
      return session;
    }

    async function fetchArticles() {
      document.getElementById('loadingState').style.display = 'block';
      const res = await fetch('/api/news');
      if (!res.ok) throw new Error('Failed to fetch');
      articles = await res.json();
      document.getElementById('loadingState').style.display = 'none';
      renderTable();
    }

    function renderTable() {
      const wrap = document.getElementById('newsTableWrap');
      if (!articles.length) {
        wrap.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-newspaper"></i>
            <p>No news articles yet. Click "Add News Article" to create one.</p>
          </div>
        `;
        return;
      }
      wrap.innerHTML = `
        <table class="news-table">
          <thead>
            <tr>
              <th>Category</th>
              <th class="col-title">Title</th>
              <th class="col-text">Content</th>
              <th>Date</th>
              <th class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${articles.map(a => `
              <tr>
                <td><span class="cat-badge">${a.cat}</span></td>
                <td><span class="title-text">${a.title}</span></td>
                <td><span class="text-preview">${a.text}</span></td>
                <td><span class="date-small">${a.date}</span></td>
                <td class="col-actions">
                  <button class="btn-icon btn-edit" onclick="openEditModal(${a.id})" title="Edit"><i class="fas fa-pen"></i></button>
                  <button class="btn-icon btn-del" onclick="deleteArticle(${a.id})" title="Delete"><i class="fas fa-trash"></i></button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function openAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add News Article';
      document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save"></i> Save Article';
      document.getElementById('newsForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('modalOverlay').classList.add('active');
    }

    function openEditModal(id) {
      const article = articles.find(a => a.id === id);
      if (!article) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = 'Edit News Article';
      document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save"></i> Update Article';
      document.getElementById('editId').value = id;
      document.getElementById('cat').value = article.cat;
      document.getElementById('date').value = article.date;
      document.getElementById('title').value = article.title;
      document.getElementById('author').value = article.author;
      document.getElementById('img').value = article.img;
      document.getElementById('text').value = article.text;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    async function saveArticle() {
      const session = await checkSession();
      if (!session) return;

      const cat = document.getElementById('cat').value;
      const date = document.getElementById('date').value;
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      const img = document.getElementById('img').value;
      const text = document.getElementById('text').value;
      const editId = document.getElementById('editId').value;

      if (!cat || !date || !title || !text) {
        showToast('Please fill in all required fields.');
        return;
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.classList.add('loading-btn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      try {
        const body = editId ? { id: parseInt(editId), cat, title, date, author, img, text } : { cat, title, date, author, img, text };
        const method = editId ? 'PUT' : 'POST';

        const res = await fetch('/api/news', {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Failed to save');
        }

        showToast(editId ? 'Article updated successfully!' : 'Article created successfully!');
        closeModal();
        await fetchArticles();
      } catch (err) {
        showToast('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading-btn');
        btn.innerHTML = editId ? '<i class="fas fa-save"></i> Update Article' : '<i class="fas fa-save"></i> Save Article';
      }
    }

    async function deleteArticle(id) {
      if (!confirm('Are you sure you want to delete this news article? This action cannot be undone.')) return;

      const session = await checkSession();
      if (!session) return;

      try {
        const res = await fetch(`/api/news?id=${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${session.access_token}` }
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Failed to delete');
        }

        showToast('Article deleted successfully!');
        await fetchArticles();
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    }

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    (async function init() {
      const session = await checkSession();
      if (session) {
        await fetchArticles();
      }
    })();
  </script>
</body>
</html>
