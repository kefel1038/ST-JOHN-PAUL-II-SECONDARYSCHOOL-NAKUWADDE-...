<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | St. John Paul II School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/admin-config.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--royal-blue), #0D2D8A);
      padding: 20px;
    }
    .login-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      box-shadow: var(--shadow-xl);
      width: 100%;
      max-width: 420px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      margin-bottom: 12px;
    }
    .login-logo h1 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--royal-blue);
    }
    .login-logo p {
      font-size: 0.85rem;
      color: var(--gray-500);
      margin-top: 4px;
    }
    .login-error {
      background: #FEE2E2;
      color: var(--danger);
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }
    .login-error.show { display: block; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius);
      font-size: 0.9rem;
      transition: var(--transition);
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--royal-blue);
      box-shadow: 0 0 0 4px rgba(10,36,114,0.08);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--royal-blue), var(--blue-light));
      color: var(--white);
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(10,36,114,0.35); }
    .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--gray-500);
    }
    .login-footer a { color: var(--royal-blue); font-weight: 600; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="../school_logo.png" alt="School Logo" />
      <h1>Admin Login</h1>
      <p>St. John Paul II Secondary School Nakuwadde</p>
    </div>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="admin@school.com" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        <i class="fas fa-lock"></i> Sign In
      </button>
    </form>

    <div class="login-footer">
      <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
    </div>
  </div>

  <script>
    const supabase = supabaseJs.createClient(ADMIN_SUPABASE_URL, ADMIN_SUPABASE_ANON_KEY);
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    async function handleLogin(email, password) {
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
      loginError.classList.remove('show');

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-lock"></i> Sign In';
        loginError.textContent = error.message === 'Invalid login credentials'
          ? 'Invalid email or password. Please try again.'
          : error.message;
        loginError.classList.add('show');
        return;
      }

      loginBtn.innerHTML = '<i class="fas fa-check"></i> Redirecting...';
      window.location.href = 'dashboard.html';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      handleLogin(emailInput.value, passwordInput.value);
    });
  </script>
</body>
</html>
